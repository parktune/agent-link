[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-bridge"
version = "0.2.0"
description = "Feasibility-first bridge for independent Codex conversations"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.optional-dependencies]
security = ["mcp>=1.20,<2"]
diagnostics = ["websockets>=15,<17"]

[project.scripts]
codex-bridge = "codex_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["codex_bridge*"]
